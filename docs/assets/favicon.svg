<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="face" x1="0.05" y1="0.05" x2="0.92" y2="0.98">
      <stop offset="0"    stop-color="#63d29c"/>
      <stop offset="0.42" stop-color="#2f6f78"/>
      <stop offset="1"    stop-color="#141d39"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#e6eaec"/>
      <stop offset="0.5" stop-color="#9aa1a6"/>
      <stop offset="1"   stop-color="#586166"/>
    </linearGradient>
  </defs>

  <!-- metallic bezel -->
  <polygon points="256,24 460,142 460,370 256,488 52,370 52,142"
           fill="url(#bezel)" stroke="url(#bezel)" stroke-width="22" stroke-linejoin="round"/>

  <!-- gradient face -->
  <polygon points="256,54 434,156 434,356 256,458 78,356 78,156"
           fill="url(#face)" stroke="url(#face)" stroke-width="20" stroke-linejoin="round"/>

  <!-- tick shadow -->
  <polyline points="150,262 224,338 366,176" fill="none"
            stroke="#0a1326" stroke-opacity="0.35"
            stroke-width="54" stroke-linecap="round" stroke-linejoin="round"
            transform="translate(0,7)"/>

  <!-- tick -->
  <polyline points="150,262 224,338 366,176" fill="none"
            stroke="#ffffff" stroke-width="54"
            stroke-linecap="round" stroke-linejoin="round"/>
</svg>
