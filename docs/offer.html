<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NextTick — Оферта</title>
    <link rel="canonical" href="https://nexttick.it/offer/ru.html" />
    <link
      rel="alternate"
      hreflang="uk"
      href="https://nexttick.it/offer/uk.html"
    />
    <link
      rel="alternate"
      hreflang="ru"
      href="https://nexttick.it/offer/ru.html"
    />
    <link
      rel="alternate"
      hreflang="x-default"
      href="https://nexttick.it/offer/ru.html"
    />
    <script>
      (function () {
        var LOCS = ["uk", "ru"],
          def = "ru";
        var loc;
        try {
          loc = localStorage.getItem("lang");
        } catch (e) {}
        if (LOCS.indexOf(loc) < 0) {
          loc = def;
          var langs =
            navigator.languages && navigator.languages.length
              ? navigator.languages
              : [navigator.language || ""];
          for (var i = 0; i < langs.length; i++) {
            var t = (langs[i] || "").toLowerCase();
            if (t.indexOf("uk") === 0) {
              loc = "uk";
              break;
            }
            if (t.indexOf("ru") === 0) {
              loc = "ru";
              break;
            }
          }
        }
        location.replace(
          "/offer/" + loc + ".html" + location.search + location.hash,
        );
      })();
    </script>
    <meta http-equiv="refresh" content="0; url=/offer/ru.html" />
  </head>
  <body>
    <noscript>
      <p style="font-family: system-ui, sans-serif; padding: 24px">
        Оферта / Оферта:
        <a href="/offer/uk.html">Українською</a> ·
        <a href="/offer/ru.html">На русском</a>
      </p>
    </noscript>
  </body>
</html>
