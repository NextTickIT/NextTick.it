<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NextTick — Политика конфиденциальности</title>
    <link rel="canonical" href="https://nexttick.it/ru/privacy/" />
    <link
      rel="alternate"
      hreflang="uk"
      href="https://nexttick.it/uk/privacy/"
    />
    <link
      rel="alternate"
      hreflang="ru"
      href="https://nexttick.it/ru/privacy/"
    />
    <link
      rel="alternate"
      hreflang="x-default"
      href="https://nexttick.it/ru/privacy/"
    />
    <script>
      /* Locale router for the privacy page. The document exists only in uk + ru;
     an unknown/other saved or browser locale falls back to the ru default. */
      (function () {
        var SUB = "privacy/";
        var loc;
        try {
          loc = localStorage.getItem("lang");
        } catch (e) {}
        if (loc !== "uk" && loc !== "ru") {
          loc = "ru";
          var langs =
            navigator.languages && navigator.languages.length
              ? navigator.languages
              : [navigator.language || ""];
          for (var i = 0; i < langs.length; i++) {
            var t = (langs[i] || "").toLowerCase();
            if (t.indexOf("uk") === 0) {
              loc = "uk";
              break;
            }
            if (t.indexOf("ru") === 0) {
              loc = "ru";
              break;
            }
          }
        }
        location.replace(
          "/" + loc + "/" + SUB + location.search + location.hash,
        );
      })();
    </script>
    <meta http-equiv="refresh" content="0; url=/ru/privacy/" />
  </head>
  <body>
    <noscript>
      <p style="font-family: system-ui, sans-serif; padding: 24px">
        Политика конфиденциальности / Політика конфіденційності:
        <a href="/ru/privacy/">На русском</a> ·
        <a href="/uk/privacy/">Українською</a>
      </p>
    </noscript>
  </body>
</html>
